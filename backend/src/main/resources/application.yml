server:
  port: 8080

spring:
  application:
    name: vehicle-maintenance-api

  # Configuración de la base de datos
  datasource:
    url: jdbc:postgresql://localhost:5434/vehicle_maintenance
    username: postgres
    password: Alexandra1
    driver-class-name: org.postgresql.Driver

  # JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: validate  # Flyway gestiona el esquema
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Flyway (migraciones)
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # Jackson (JSON)
  jackson:
    serialization:
      write-dates-as-timestamps: false
    date-format: yyyy-MM-dd'T'HH:mm:ss'Z'
    time-zone: UTC

# JWT Configuration
jwt:
  secret: "dGhpcyBpcyBhIHZlcnkgc2VjdXJlIGp3dCBzZWNyZXQga2V5IGZvciB2ZWhpY2xlIG1haW50ZW5hbmNlIGFwcA=="
  expiration: 86400000  # 24 horas en milisegundos

# SpringDoc OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

# Logging
logging:
  level:
    com.vehicle.maintenance: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
