<div class="auth-container">
  <div class="auth-left">
    <div class="auth-brand">
      <span class="material-icons-round brand-icon">person_add</span>
      <div class="brand-text">
        <h1>Crear</h1>
        <span>Cuenta</span>
      </div>
    </div>
    <div class="auth-illustration">
      <div class="illustration-card">
        <span class="material-icons-round">verified</span>
        <p>Registro rápido y seguro</p>
      </div>
      <div class="illustration-card delay-1">
        <span class="material-icons-round">cloud_sync</span>
        <p>Tus datos siempre sincronizados</p>
      </div>
      <div class="illustration-card delay-2">
        <span class="material-icons-round">support_agent</span>
        <p>Soporte técnico 24/7</p>
      </div>
    </div>
  </div>

  <div class="auth-right">
    <div class="auth-form-container">
      <div class="auth-header">
        <h2>Crear Cuenta</h2>
        <p>Completa tus datos para registrarte</p>
      </div>

      <form (ngSubmit)="onSubmit()" class="auth-form">
        <div class="form-row">
          <div class="form-group flex-2">
            <label>Nombre completo *</label>
            <div class="input-wrapper">
              <span class="material-icons-round input-icon">person</span>
              <input type="text" [(ngModel)]="fullName" name="fullName" placeholder="Juan Pérez" required>
            </div>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group flex-2">
            <label>Correo electrónico *</label>
            <div class="input-wrapper">
              <span class="material-icons-round input-icon">email</span>
              <input type="email" [(ngModel)]="email" name="email" placeholder="tu@correo.com" required>
            </div>
          </div>
          <div class="form-group flex-1">
            <label>Teléfono</label>
            <div class="input-wrapper">
              <span class="material-icons-round input-icon">phone</span>
              <input type="tel" [(ngModel)]="phone" name="phone" placeholder="+51">
            </div>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group flex-1">
            <label>Contraseña *</label>
            <div class="input-wrapper">
              <span class="material-icons-round input-icon">lock</span>
              <input [type]="hidePassword ? 'password' : 'text'" [(ngModel)]="password" name="password" placeholder="••••••" required>
              <button type="button" class="toggle-password" (click)="hidePassword = !hidePassword">
                <span class="material-icons-round">{{ hidePassword ? 'visibility_off' : 'visibility' }}</span>
              </button>
            </div>
          </div>
          <div class="form-group flex-1">
            <label>Confirmar *</label>
            <div class="input-wrapper">
              <span class="material-icons-round input-icon">lock</span>
              <input [type]="hideConfirm ? 'password' : 'text'" [(ngModel)]="confirmPassword" name="confirmPassword" placeholder="••••••" required>
              <button type="button" class="toggle-password" (click)="hideConfirm = !hideConfirm">
                <span class="material-icons-round">{{ hideConfirm ? 'visibility_off' : 'visibility' }}</span>
              </button>
            </div>
          </div>
        </div>

        <div class="form-error" *ngIf="error">
          <span class="material-icons-round">error</span>
          {{ error }}
        </div>

        <button type="submit" class="btn-submit" [disabled]="loading">
          <span *ngIf="!loading">Crear Cuenta</span>
          <span *ngIf="loading" class="spinner"></span>
        </button>
      </form>

      <p class="auth-footer-text">
        ¿Ya tienes cuenta?
        <a routerLink="/login">Inicia sesión</a>
      </p>
    </div>
  </div>
</div>
