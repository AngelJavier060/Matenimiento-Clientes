<div class="login-only">
  <header class="login-only__bar">
    <a routerLink="/" class="login-only__brand">Improvement Solution</a>
    <a routerLink="/" class="login-only__back">← Volver al inicio</a>
  </header>

  <main class="login-only__main">
    <div class="login-only__card glass-panel inner-glow">
      <div class="login-only__head">
        <h1 class="login-only__title">Iniciar sesión</h1>
        <p class="login-only__hint">Introduce tus credenciales para acceder a la intranet.</p>
      </div>

      <form (ngSubmit)="onSubmit()" class="login-form" novalidate>
        <div class="login-field">
          <label for="login-email">Correo electrónico</label>
          <div class="login-input-wrap">
            <span class="material-symbols-outlined login-input-wrap__icon">mail</span>
            <input
              id="login-email"
              type="email"
              [(ngModel)]="email"
              name="email"
              placeholder="tu@empresa.com"
              required
              autocomplete="email"
              [disabled]="loading"
            />
          </div>
        </div>

        <div class="login-field">
          <label for="login-password">Contraseña</label>
          <div class="login-input-wrap">
            <span class="material-symbols-outlined login-input-wrap__icon">lock</span>
            <input
              id="login-password"
              [type]="hidePassword ? 'password' : 'text'"
              [(ngModel)]="password"
              name="password"
              placeholder="••••••••"
              required
              autocomplete="current-password"
              [disabled]="loading"
            />
            <button
              type="button"
              class="login-input-wrap__toggle"
              (click)="hidePassword = !hidePassword"
              [attr.aria-label]="hidePassword ? 'Mostrar contraseña' : 'Ocultar contraseña'"
            >
              <span class="material-symbols-outlined">{{
                hidePassword ? 'visibility_off' : 'visibility'
              }}</span>
            </button>
          </div>
        </div>

        <div class="login-alert" *ngIf="error" role="alert">
          <span class="material-symbols-outlined">error</span>
          {{ error }}
        </div>

        <button type="submit" class="login-submit" [disabled]="loading">
          <span *ngIf="!loading">Iniciar sesión</span>
          <span *ngIf="loading" class="login-submit__spinner" aria-hidden="true"></span>
        </button>
      </form>

      <p class="login-only__register">
        ¿No tienes cuenta?
        <a routerLink="/register">Regístrate</a>
      </p>
    </div>
  </main>

  <footer class="login-only__footer">© {{ year }} Improvement Solution.</footer>
</div>
