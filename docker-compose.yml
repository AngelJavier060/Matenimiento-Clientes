services:
  postgres:
    image: postgres:16-alpine
    container_name: vehicle_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: vehicle_maintenance
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    # Solo red interna de Compose (vehicle_api usa hostname "postgres").
    # Si necesitás acceso desde el host, usá también:
    #   docker-compose.expose-postgres.yml (ej. localhost:5433)
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d vehicle_maintenance"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - vehicle-network

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: vehicle_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/vehicle_maintenance
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin123
      JWT_SECRET: "dGhpcyBpcyBhIHZlcnkgc2VjdXJlIGp3dCBzZWNyZXQga2V5IGZvciB2ZWhpY2xlIG1haW50ZW5hbmNlIGFwcA=="
      JWT_EXPIRATION: 86400000
    # Sin publicar puertos en el host por defecto (evita choque con NPM u otros).
    # En tu PC: también docker-compose.publish-ports.yml
    # En el servidor: docker-compose.override.yml (ej. 9088/9089)
    volumes:
      - vehicle-uploads:/app/uploads
    networks:
      - vehicle-network

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: vehicle_frontend
    restart: unless-stopped
    depends_on:
      - backend
    # Ver comentario del servicio backend (ports vía override o publish-ports.yml)
    networks:
      - vehicle-network

networks:
  vehicle-network:
    driver: bridge

volumes:
  pgdata:
  vehicle-uploads:
